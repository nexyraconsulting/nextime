# NexHR - Nginx site configuration. Copy to /etc/nginx/sites-available/nexhr and enable it.
# Replace nexhr.com with your BASE_DOMAIN and the certificate paths with yours.
server {
  listen 80;
  server_name nexhr.com www.nexhr.com *.nexhr.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name nexhr.com www.nexhr.com *.nexhr.com;

  # One certificate covering nexhr.com and *.nexhr.com (wildcard; Let's Encrypt DNS-01).
  ssl_certificate     /etc/letsencrypt/live/nexhr.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nexhr.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 11m;   # uploads are limited to 10 MB by the API

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # After running scripts/vendor_frontend_libs.sh, remove https://unpkg.com from script-src.
  # 'unsafe-inline' and 'unsafe-eval' are required because support.js compiles each page's logic in the browser.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com; base-uri 'self'" always;

  # Never serve these, even if Nginx is later pointed at the package folder directly.
  location ~ /\.(?!well-known) { deny all; }
  location ~ ^/(server|database|config|scripts)/ { deny all; }
  location ~ \.(md|sql|sh)$ { deny all; }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;                       # the API reads the workspace from this
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
